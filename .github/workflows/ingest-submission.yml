name: Ingest student material submission

on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Canonical UUID of the approved HENU Kit Library submission"
        required: true
        type: string
      ingest_token:
        description: "Single-use opaque token issued by HENU Kit Library"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ingest-submission-${{ inputs.submission_id }}
  cancel-in-progress: false

jobs:
  ingest:
    name: Fetch, validate, and open submission PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUBMISSION_ID: ${{ inputs.submission_id }}
      INGEST_API_BASE: ${{ vars.HENUKIT_INGEST_API_BASE || 'https://henukit.cn' }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run repository script tests
        run: node --test tests/*.test.mjs

      - name: Fetch verified submission payload and apply to workspace
        id: apply
        env:
          INGEST_TOKEN: ${{ inputs.ingest_token }}
          CALLBACK_SECRET: ${{ secrets.HENUKIT_SUBMISSION_CALLBACK_SECRET }}
        run: |
          echo "::add-mask::$INGEST_TOKEN"
          node scripts/ingest-submission.mjs fetch-and-apply

      - name: Refresh metadata, regenerate README, and run authoritative validators
        run: |
          node scripts/refresh-manifest-metadata.mjs --write
          node scripts/update-readme.mjs
          node scripts/validate-materials.mjs
          node scripts/update-readme.mjs --check
          python3 scripts/audit-material-duplicates.py .
          git diff --check

      - name: Commit submission on dedicated branch
        id: commit
        env:
          SUBMISSION_BRANCH: ${{ steps.apply.outputs.branch }}
          PR_TITLE: ${{ steps.apply.outputs.pr_title }}
          PUBLIC_PATH: ${{ steps.apply.outputs.public_path }}
        run: |
          git switch -C "$SUBMISSION_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$PUBLIC_PATH" manifest.json README.md
          if git diff --cached --quiet; then
            echo "Submission ingestion produced no staged changes." >&2
            exit 1
          fi
          git commit -m "$PR_TITLE"
          git push --force-with-lease --set-upstream origin "$SUBMISSION_BRANCH"

      - name: Create or update submission pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMISSION_BRANCH: ${{ steps.apply.outputs.branch }}
          PR_TITLE: ${{ steps.apply.outputs.pr_title }}
          PR_BODY_FILE: ${{ steps.apply.outputs.pr_body_file }}
        run: |
          existing_url="$(gh pr list --head "$SUBMISSION_BRANCH" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing_url" ]; then
            gh pr edit "$existing_url" --title "$PR_TITLE" --body-file "$PR_BODY_FILE"
            pr_url="$existing_url"
          else
            pr_url="$(gh pr create \
              --base "$BASE_BRANCH" \
              --head "$SUBMISSION_BRANCH" \
              --title "$PR_TITLE" \
              --body-file "$PR_BODY_FILE")"
          fi
          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          printf '### 投稿入库 PR\n\n%s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Report PR creation success to HENU Kit Library
        env:
          CALLBACK_SECRET: ${{ secrets.HENUKIT_SUBMISSION_CALLBACK_SECRET }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          SUBMISSION_BRANCH: ${{ steps.apply.outputs.branch }}
        run: |
          node scripts/ingest-submission.mjs callback \
            --outcome pr_open \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --branch "$SUBMISSION_BRANCH"

      - name: Report failure callback to HENU Kit Library
        if: failure()
        env:
          CALLBACK_SECRET: ${{ secrets.HENUKIT_SUBMISSION_CALLBACK_SECRET }}
          FAILURE_REASON: ${{ env.INGEST_FAILURE_REASON || 'Submission ingestion workflow failed during validation or PR creation.' }}
        run: |
          if [ -z "${CALLBACK_SECRET:-}" ]; then
            echo "CALLBACK_SECRET is not set; skipping failure callback." >&2
            exit 0
          fi
          node scripts/ingest-submission.mjs callback \
            --outcome pr_failed \
            --error "$FAILURE_REASON"
